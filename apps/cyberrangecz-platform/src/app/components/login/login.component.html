<div class="login-wrapper">
    <mat-card appearance="outlined" class="login-card">
        @if (markUrl) {
            <img class="login-card__logo" [src]="markUrl" [alt]="title" />
        } @else {
            <div class="login-card__mark">CG</div>
        }
        <mat-card-title>
            <h2>{{ title }}</h2>
        </mat-card-title>
        <mat-card-subtitle>
            <p>{{ subtitle }}</p>
        </mat-card-subtitle>
        <mat-card-content>
            <sentinel-auth-provider-list class="providers" />
        </mat-card-content>
    </mat-card>
</div>
