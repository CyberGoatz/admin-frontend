<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CyberGoatz Admin</title>
    <base href="/">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="/assets/icon/favicon.ico" rel="icon" type="image/x-icon">
    <style>

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 16% 0, color-mix(in oklab, #545f72 10%, transparent), transparent 28rem),
                linear-gradient(180deg, #f8f9fa 0%, #f3f4f5 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif;
            z-index: 9999;
        }

        .loading-logo {
            font-size: 3rem;
            font-weight: 600;
            color: #191c1d;
            margin-bottom: 2rem;
            font-family: 'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif;
            height: 200px;
            z-index: 999;
        }

        .loader {
            width: fit-content;
            font-weight: bold;
            font-family: monospace;
            font-size: 30px;
            background: linear-gradient(135deg, #0000 calc(50% - 0.5em), #b23a73 0 calc(50% + 0.5em), #0000 0) right/300% 100%;
            animation: l22 2s infinite;
            border-radius: 4px;
            z-index: 999;
        }

        .loader::before {
            content: "Loading...";
            color: #0000;
            padding: 0 5px;
            background: inherit;
            background-image: linear-gradient(135deg, #191c1d calc(50% - 0.5em), #ffffff 0 calc(50% + 0.5em), #191c1d 0);
            -webkit-background-clip: text;
            background-clip: text;
            z-index: 999;
        }

        @keyframes l22 {
            100% {
                background-position: left
            }
        }

        .sidebar {
            position: absolute;
            left: 0;
            width: 140px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #d8d2df;
        }

        @keyframes sidebarPulse {
            0% {
                background: #ffffff;
            }
            100% {
                background: #ffffff;
            }
        }

        .toolbar-top {
            position: absolute;
            top: 0;
            right: 0;
            width: calc(100% - 140px);
            height: 50px;
            background: #ffffff;
            border-bottom: 1px solid #d8d2df;
            box-shadow: none;
            overflow: visible;
            animation: toolbarTopAnim 2.5s infinite alternate;
        }

        @keyframes toolbarTopAnim {
            0% {
                background: #ffffff;
            }
            100% {
                background: #ffffff;
            }
        }

        .toolbar-bottom {
            position: absolute;
            top: 50px;
            right: 0;
            width: calc(100% - 140px);
            height: 40px;
            background: #ffffff;
            border-bottom: 1px solid #d8d2df;
            overflow: visible;
            animation: toolbarBottomAnim 2.5s infinite;
        }

        @keyframes toolbarBottomAnim {
            0% {
                background: #ffffff;
            }
            100% {
                background: #ffffff;
            }
        }

        .layout-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<crczp-app-root class="mat-typography">
    <div class="loading-container">
        <div class="loading-alignment">
            <img alt="CyberGoatz Admin" class="loading-logo" src="./assets/logo/logo-black.svg" />
            <div class="loader-container">
                <div class="loader"></div>
            </div>
        </div>
        <div class="layout-overlay">
            <div class="sidebar"></div>
            <div class="toolbar-bottom"></div>
            <div class="toolbar-top"></div>
        </div>
    </div>
</crczp-app-root>
</body>
</html>
