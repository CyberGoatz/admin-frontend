<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Title, favicon, logo and accent are set at runtime from the host's branding (academy-runtime.ts). -->
    <title>Admin</title>
    <base href="/">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="/assets/icon/favicon.ico" rel="icon" type="image/x-icon">
    <style>
        :root {
            --loading-accent: #545f72;
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif;
            z-index: 9999;
        }

        .loading-alignment {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            z-index: 999;
        }

        .loading-logo {
            max-height: 120px;
            max-width: 320px;
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid #d8d2df;
            border-top-color: var(--loading-accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-sidebar {
            position: absolute;
            left: 0;
            width: 140px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #d8d2df;
        }

        .loading-toolbar-top {
            position: absolute;
            top: 0;
            right: 0;
            width: calc(100% - 140px);
            height: 50px;
            background: #ffffff;
            border-bottom: 1px solid #d8d2df;
        }

        .loading-toolbar-bottom {
            position: absolute;
            top: 50px;
            right: 0;
            width: calc(100% - 140px);
            height: 40px;
            background: #ffffff;
            border-bottom: 1px solid #d8d2df;
        }

        /* Tenant hosts: the runtime sets data-tenant and --tenant-primary before bootstrap,
           so the placeholder already matches the tenant sidebar. */
        html[data-tenant] .loading-sidebar {
            width: 256px;
            background: var(--tenant-primary, #ffffff);
            border-right-color: transparent;
        }

        html[data-tenant] .loading-toolbar-top,
        html[data-tenant] .loading-toolbar-bottom {
            width: calc(100% - 256px);
        }

        html[data-tenant] .loading-toolbar-top {
            height: 56px;
            border-bottom-color: #e4e7ec;
        }

        html[data-tenant] .loading-toolbar-bottom {
            display: none;
        }

        html[data-tenant] .loading-container {
            background: #f6f7f9;
        }

        @media (max-width: 748px) {
            html[data-tenant] .loading-sidebar {
                display: none;
            }

            html[data-tenant] .loading-toolbar-top,
            html[data-tenant] .loading-toolbar-bottom {
                width: 100%;
            }
        }

        .layout-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<crczp-app-root class="mat-typography">
    <div class="loading-container">
        <div class="layout-overlay">
            <div class="loading-sidebar"></div>
            <div class="loading-toolbar-bottom"></div>
            <div class="loading-toolbar-top"></div>
        </div>
        <div class="loading-alignment">
            <img alt="" class="loading-logo" hidden />
            <div class="loader" role="progressbar" aria-label="Loading"></div>
        </div>
    </div>
</crczp-app-root>
</body>
</html>
